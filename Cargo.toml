[package]
name = "wesl_build"
version = "0.2.2"
edition = "2024"
license = "MIT OR Apache-2.0"

readme = "README.md"
repository = "https://github.com/TimTheBig/wesl_build"

keywords = ["wesl", "build", "system", "bindings"]
categories = ["development-tools::build-utils", "graphics"]

[lints.clippy]
all = "warn"

[workspace]
members = [".", "wesl_build_import", "wesl_build_example"]

[workspace.dependencies]
wesl = { version = "0.4", git = "https://github.com/TimTheBig/wesl-rs.git", package = "wesl" }

[features]
default = ["wgpu_bindings_ext", "math_consts_ext"]
logging = ["dep:env_logger", "dep:log"]
wgpu_bindings_ext = ["dep:wgsl_to_wgpu"]
wgsl_minifier_ext = ["dep:wgsl-minifier", "dep:naga"]
math_consts_ext = []

[dependencies]
wesl.workspace = true

# logging
env_logger = { version = "0.11", features = ["auto-color"], default-features = false, optional = true }
log = { version = "0.4", optional = true }
# errors
thiserror = "2.0"

# extentions
wgsl_to_wgpu = { version = "0.18", optional = true }
# wgsl_to_wgpu = { version = "0.18", git = "https://github.com/TimTheBig/wgsl_to_wgpu.git", optional = true }
wgsl-minifier = { version = "0.8", git = "https://github.com/TimTheBig/wgsl-minifier.git", optional = true }
naga = { version = "29.0", optional = true , features = ["wgsl-in", "wgsl-out"] }

# utils
itertools = "0.14"

wgsl-types = { version = "0.4", git = "https://github.com/TimTheBig/wesl-rs.git", package = "wgsl-types" }
hyperreal = { version = "0.12.0", git = "https://github.com/TimTheBig/hyperreal.git" }

[dev-dependencies]
insta = "1.47"
tempfile = "3.27"

[profile.dev.package.insta]
opt-level = 3
[profile.dev.package.similar]
opt-level = 3
